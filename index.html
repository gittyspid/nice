<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סטודיו Claude Code · ניהול סשנים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5FC; --card:#FFFFFF; --ink:#2D2A45; --muted:#7C7896; --line:#ECE8F6; --soft:#F3F0FB;
  --lav:#E4DBFD; --lav-d:#6E55D3; --mint:#D3F2E4; --mint-d:#25875F; --peach:#FFE3D4; --peach-d:#C7653A;
  --pink:#FCDCE8; --pink-d:#B8467A; --sky:#D8ECFC; --sky-d:#2F76B3; --butter:#FFF3CC; --butter-d:#9A7410;
  --r:18px; --shadow:0 1px 2px rgba(45,42,69,.04),0 8px 24px rgba(110,85,211,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik','Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* sidebar */
.side{background:linear-gradient(180deg,#FBFAFF 0%,#F4F0FE 100%);border-left:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#CDBEF7,#FAD0E0 60%,#FFE3D4);display:grid;place-items:center;font-weight:700;color:#5B45B8;font-size:18px}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:#4A4668;font-weight:500;transition:.15s}
.nav a:hover{background:#EFEAFD}
.nav a.on{background:#fff;color:var(--lav-d);box-shadow:var(--shadow)}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px}
.nav .count{margin-inline-start:auto;background:var(--pink);color:var(--pink-d);font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-radius:12px;background:#fff8;border:1px dashed var(--line)}
/* main */
main{padding:28px 34px 60px;max-width:1280px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;letter-spacing:-.3px}
.top p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:500;cursor:pointer;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:.15s;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{box-shadow:inset 0 0 0 1px #D9D1F3;background:#FCFBFF}
.btn.pri{background:var(--lav-d);color:#fff;box-shadow:0 6px 16px rgba(110,85,211,.25)}
.btn.pri:hover{background:#5E46C2}
.btn.mint{background:var(--mint);color:var(--mint-d);box-shadow:none}
.btn.pink{background:var(--pink);color:var(--pink-d);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.danger{color:#C2415B}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid #F0ECFA}
.card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.4fr 1fr}
.kpi{padding:18px 20px;border-radius:var(--r);position:relative;overflow:hidden}
.kpi .lbl{font-size:13px;font-weight:500;opacity:.85}
.kpi .val{font-size:30px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .sub{font-size:12px;opacity:.75;margin-top:2px}
.kpi .emo{position:absolute;left:16px;top:14px;font-size:24px;opacity:.9}
.k1{background:var(--lav);color:#4B3A9E}.k2{background:var(--mint);color:#1D6B4B}.k3{background:var(--sky);color:#235B8A}.k4{background:var(--peach);color:#9A4A26}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--soft);border:1px solid transparent;transition:.15s}
.item:hover{border-color:#E2DBF8;background:#F7F4FE}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.datechip{width:52px;min-width:52px;text-align:center;border-radius:12px;background:#fff;padding:6px 0;box-shadow:var(--shadow)}
.datechip b{display:block;font-size:19px;line-height:1.1}
.datechip small{font-size:11px;color:var(--muted)}
.av{width:34px;height:34px;min-width:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;border:2px solid #fff}
.avs{display:flex}.avs .av{margin-inline-start:-8px;width:28px;height:28px;min-width:28px;font-size:11px}.avs .av:first-child{margin:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-lav{background:var(--lav);color:var(--lav-d)}.b-mint{background:var(--mint);color:var(--mint-d)}.b-peach{background:var(--peach);color:var(--peach-d)}.b-pink{background:var(--pink);color:var(--pink-d)}.b-sky{background:var(--sky);color:var(--sky-d)}.b-butter{background:var(--butter);color:var(--butter-d)}.b-gray{background:#EFEDF5;color:#6C6886}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
/* table */
table.tb{width:100%;border-collapse:separate;border-spacing:0}
.tb th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:8px 12px;border-bottom:1px solid var(--line)}
.tb td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr:hover td{background:#FBFAFF}
.num{font-variant-numeric:tabular-nums}
/* students */
.scard{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.15s}
.scard:hover{transform:translateY(-2px)}
.scard .hd{display:flex;gap:12px;align-items:center}
.scard .av{width:46px;height:46px;font-size:16px}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#B9A6F5,#F4B3CE)}
.muted{color:var(--muted)}
.small{font-size:13px}
/* inputs */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:#4A4668}
.in{width:100%;border:1px solid var(--line);background:#FCFBFF;border-radius:12px;padding:10px 12px;outline:none;transition:.15s}
.in:focus{border-color:#BCADF2;background:#fff;box-shadow:0 0 0 4px #EEE9FD}
textarea.in{min-height:84px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--soft);cursor:pointer;font-size:14px;border:1px solid transparent;user-select:none}
.chk input{accent-color:var(--lav-d)}
.chk:has(input:checked){background:var(--lav);border-color:#CFC2F8;color:#4B3A9E}
.search{max-width:280px}
.tabs{display:inline-flex;background:#fff;border-radius:12px;padding:4px;box-shadow:inset 0 0 0 1px var(--line);gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--lav);color:var(--lav-d)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(45,42,69,.28);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:22px;width:100%;max-width:640px;padding:26px;box-shadow:0 30px 80px rgba(45,42,69,.25);animation:pop .18s}
.modal h2{margin:0 0 18px;font-size:20px}
.modal .acts{display:flex;justify-content:flex-start;gap:10px;margin-top:8px;flex-direction:row}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .2s;font-size:14px}
/* chart */
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .stack{width:100%;max-width:42px;display:flex;flex-direction:column-reverse;border-radius:10px;overflow:hidden;background:var(--soft);height:100%;justify-content:flex-start}
.bar .paid{background:#BFE9D5}.bar .open{background:#FFD0BA}
.bar small{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* matrix */
.mx{overflow:auto}
.mx table{border-collapse:separate;border-spacing:6px}
.mx th{font-size:12px;color:var(--muted);font-weight:500;padding:4px;white-space:nowrap}
.mx td.c{width:38px;height:38px;border-radius:10px;text-align:center;background:var(--soft);font-size:15px}
.mx td.c.y{background:var(--mint);color:var(--mint-d);font-weight:700}
.mx td.c.p{background:var(--butter);color:var(--butter-d)}
.mx td.nm{white-space:nowrap;font-weight:500;padding-inline-end:10px}
/* modules */
.mod{border-radius:var(--r);padding:18px;background:#fff;box-shadow:var(--shadow);border:1px solid #F0ECFA;display:flex;flex-direction:column;gap:10px}
.mod .n{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700}
.mod ul{margin:0;padding-inline-start:18px;color:#4A4668;font-size:14px}
code,.code{font-family:Consolas,'Cascadia Code',monospace;background:#F1EEFB;color:#5B45B8;padding:2px 7px;border-radius:7px;font-size:13px;direction:ltr;display:inline-block}
/* mail */
.mailgrid{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.preview{background:#F2EFF9;border-radius:var(--r);padding:22px;max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:20px}
.preview .bar2{display:flex;gap:6px;margin-bottom:12px;align-items:center;color:var(--muted);font-size:12px}
.preview .bar2 i{width:10px;height:10px;border-radius:50%;background:#E3DDF3;display:inline-block}
.hint{font-size:12.5px;color:var(--muted);background:var(--butter);border-radius:12px;padding:10px 12px;line-height:1.55}
.hint b{color:var(--butter-d)}
.sep{height:1px;background:var(--line);margin:16px 0}
.pill-num{font-weight:700;font-size:20px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.mailgrid{grid-template-columns:1fr}.preview{position:static;max-height:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:40;padding:8px;border-left:0;border-top:1px solid var(--line);background:#fff}
  .brand,.side .foot{display:none}
  .nav{display:flex;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px}
  .nav .count{display:none}
  main{padding:20px 14px 100px;min-width:0;overflow-x:hidden}
  .kpi{padding:14px}.kpi .val{font-size:22px}.kpi .emo{display:none}
  .item{flex-wrap:wrap;gap:10px}.item .grow{flex-basis:60%}
  .avs.hide-m{display:none}
  .grid{min-width:0}.card{min-width:0;overflow-x:auto}
  .g2,.g3,.f2,.f3{grid-template-columns:1fr}
  .tb .hide-m{display:none}
}
@media print{.side,.top .row{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">✦</div><div><b id="brandName">סטודיו Claude Code</b><small>ניהול סשנים ודיוורים</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">💾 הנתונים נשמרים בדפדפן הזה בלבד. מומלץ לגבות מדי פעם במסך ההגדרות.</div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ============ data ============ */
const KEY = 'cc-studio-v1';
const PASTELS = [['#E4DBFD','#5B45B8'],['#D3F2E4','#1D6B4B'],['#FFE3D4','#9A4A26'],['#FCDCE8','#9E3366'],['#D8ECFC','#235B8A'],['#FFF3CC','#7D5E0A']];

function defaultModules(){
  return [
    {id:'m1',num:1,title:'היכרות והתקנה',goal:'להבין מה זה Claude Code ולהריץ אותו בפעם הראשונה',
      points:['מה זה Claude Code ובמה הוא שונה מצ׳אט רגיל','התקנה על המחשב והתחברות לחשבון','היכרות עם הטרמינל ועם אפליקציית הדסקטופ','הבקשה הראשונה: לתת ל-Claude לבנות משהו קטן'],
      commands:['claude','/help','/login'],
      tips:['אפשר לכתוב ל-Claude בעברית רגילה, בדיוק כמו לאדם','לפתוח את Claude תמיד מתוך תיקיית הפרויקט'],
      homework:'להתקין את Claude Code, לפתוח תיקייה חדשה ולבקש ממנו לבנות דף HTML פשוט עם הודעת "שלום".'},
    {id:'m2',num:2,title:'עבודה עם קבצים ושיחה נכונה',goal:'לנהל שיחה יעילה ולתת ל-Claude לקרוא ולערוך קבצים',
      points:['איך מנסחים בקשה טובה: הקשר, מטרה ודוגמה','הפניה לקבצים עם @','אישור עריכות וקריאת השינויים','עצירה באמצע עם Esc ותיקון כיוון'],
      commands:['@שם-קובץ','/clear','Esc'],
      tips:['בקשה אחת ברורה עדיפה על חמש בקשות מעורבבות','אחרי משימה גדולה כדאי לפתוח שיחה חדשה עם /clear'],
      homework:'לבקש מ-Claude לשפר את הדף מהשיעור הקודם: להוסיף עיצוב, תמונה וכפתור.'},
    {id:'m3',num:3,title:'הרשאות ומצבי עבודה',goal:'לשלוט במה ש-Claude רשאי לעשות לבד',
      points:['מה Claude שואל לפני שהוא פועל ולמה','מעבר בין מצבי עבודה עם Shift+Tab','Plan mode: לתכנן לפני שכותבים קוד','הגדרת הרשאות קבועות לפקודות בטוחות'],
      commands:['Shift+Tab','/permissions'],
      tips:['במשימה גדולה מתחילים ב-Plan mode ומאשרים תוכנית','לא לאשר פקודות שלא מבינים, תמיד אפשר לשאול "מה זה עושה?"'],
      homework:'לתכנן ב-Plan mode פרויקט קטן (למשל רשימת משימות) ולאשר את התוכנית לפני הביצוע.'},
    {id:'m4',num:4,title:'CLAUDE.md וזיכרון',goal:'ללמד את Claude על הפרויקט כדי שלא נחזור על עצמנו',
      points:['מה זה קובץ CLAUDE.md ולמה הוא חשוב','יצירה אוטומטית עם /init','מה כדאי לכתוב בו: סגנון, כללים, פקודות','זיכרון אישי מול זיכרון של פרויקט'],
      commands:['/init','/memory'],
      tips:['כל פעם שמתקנים את Claude על אותו דבר פעמיים, זה סימן להוסיף כלל ל-CLAUDE.md','לשמור את הקובץ קצר וממוקד'],
      homework:'להריץ /init בפרויקט, לקרוא את הקובץ שנוצר ולהוסיף לו 3 כללים משלך.'},
    {id:'m5',num:5,title:'Git ו-GitHub',goal:'לשמור גרסאות ולגבות את העבודה בענן',
      points:['מה זה Git ולמה צריך אותו','commit: נקודת שמירה עם הסבר','חיבור לריפו ב-GitHub ודחיפה (push)','לבקש מ-Claude לעשות commit בשבילך'],
      commands:['git status','git add .','git commit -m "..."','git push'],
      tips:['commit קטן ותכוף עדיף על אחד ענק','אפשר פשוט לכתוב ל-Claude: "תעשה commit לשינויים"'],
      homework:'ליצור ריפו ב-GitHub, לחבר אליו את הפרויקט ולדחוף את הגרסה הראשונה.'},
    {id:'m6',num:6,title:'העלאה לאוויר עם Vercel',goal:'להפוך את הפרויקט לאתר חי עם כתובת',
      points:['חיבור Vercel לחשבון GitHub','ייבוא הריפו ופריסה ראשונה','עדכון אוטומטי בכל push','חיבור דומיין משלך'],
      commands:['git push'],
      tips:['התוכנית החינמית של Vercel מספיקה לפרויקטים אישיים','כל push לענף main מעדכן את האתר תוך דקה'],
      homework:'להעלות את הפרויקט ל-Vercel ולשלוח לי את הקישור לאתר החי.'},
    {id:'m7',num:7,title:'MCP, Skills ופקודות',goal:'לחבר את Claude לכלים נוספים ולהרחיב את היכולות שלו',
      points:['מה זה MCP ואיך מחברים שרת','Skills: הוראות מוכנות למשימות חוזרות','פקודות סלאש מותאמות אישית','בחירת מודל לפי המשימה'],
      commands:['/mcp','claude mcp add','/model'],
      tips:['להתחיל עם חיבור אחד שימושי ולא עשרה בבת אחת','Skill טוב חוסך כתיבת אותן הוראות בכל פעם מחדש'],
      homework:'לחבר שרת MCP אחד (למשל לדפדפן או ל-GitHub) ולהשתמש בו במשימה אמיתית.'},
    {id:'m8',num:8,title:'עבודה מתקדמת וטיפים',goal:'לעבוד מהר יותר ולנהל פרויקטים גדולים',
      points:['המשך שיחה קודמת וחזרה אחורה','דחיסת שיחה ארוכה עם /compact','חלוקת משימה גדולה לשלבים','בדיקה עצמית: לבקש מ-Claude לבדוק את העבודה שלו'],
      commands:['claude -c','/resume','/compact','Esc Esc'],
      tips:['לבקש תמיד מ-Claude להריץ ולבדוק את מה שבנה','שיחה ממוקדת אחת לכל משימה'],
      homework:'לבנות פרויקט קטן מההתחלה ועד אתר חי, לבד, ולהביא שאלות לסשן הבא.'}
  ];
}
function defaults(){
  return {settings:{instructor:'',business:'סטודיו Claude Code',email:'',phone:'',price:350,payment:'',signature:'מחכה לראות מה תבנו! ✨',site:''},
    students:[],sessions:[],modules:defaultModules(),mails:[]};
}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)); if(d){const b=defaults(); return {...b,...d,settings:{...b.settings,...(d.settings||{})}};}}catch(e){}
  return defaults();
}
let db = load();

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₪' + Math.round(n||0).toLocaleString('he-IL');
const todayISO = () => new Date().toISOString().slice(0,10);
const dayOffset = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const HM = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HD = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function pd(iso){ const [y,m,d]=(iso||todayISO()).split('-').map(Number); return new Date(y,m-1,d); }
function fdate(iso){ if(!iso) return ''; const d=pd(iso); return `${d.getDate()} ב${HM[d.getMonth()]} ${d.getFullYear()}`; }
function fdateLong(iso){ if(!iso) return ''; const d=pd(iso); return `יום ${HD[d.getDay()]}, ${d.getDate()} ב${HM[d.getMonth()]}`; }
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('');
function colorOf(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return PASTELS[h%PASTELS.length]; }
function avatar(s){ const [bg,fg]=colorOf(s.id); return `<span class="av" style="background:${bg};color:${fg}" title="${esc(s.name)}">${esc(initials(s.name))}</span>`; }
const student = id => db.students.find(s=>s.id===id);
const sessionById = id => db.sessions.find(s=>s.id===id);
const moduleById = id => db.modules.find(m=>m.id===id);
const sortedModules = () => [...db.modules].sort((a,b)=>a.num-b.num);
const sessTitle = s => s.title || (moduleById(s.moduleId)?.title) || 'סשן';
const firstName = n => (n||'').trim().split(/\s+/)[0] || '';

function studentStats(sid){
  const ss = db.sessions.filter(s=>s.studentIds.includes(sid));
  const done = ss.filter(s=>s.status==='done');
  const charged = done.reduce((a,s)=>a+(+s.price||0),0);
  const paid = done.filter(s=>s.paid?.[sid]).reduce((a,s)=>a+(+s.price||0),0);
  const mods = new Set(done.map(s=>s.moduleId).filter(Boolean));
  const next = ss.filter(s=>s.status==='planned').sort((a,b)=>a.date.localeCompare(b.date))[0];
  const last = done.sort((a,b)=>b.date.localeCompare(a.date))[0];
  return {all:ss, done, charged, paid, balance:charged-paid, mods, next, last};
}
function summarySent(sess, sid){ return db.mails.some(m=>m.type==='summary' && m.sessionId===sess.id && m.studentIds.includes(sid)); }
function sessionPayState(s){
  if(s.status!=='done' || !s.studentIds.length) return null;
  const n = s.studentIds.filter(id=>s.paid?.[id]).length;
  return n===s.studentIds.length ? 'paid' : n ? 'partial' : 'open';
}
function pendingSummaries(){
  const out=[];
  db.sessions.filter(s=>s.status==='done').forEach(s=>{
    const miss = s.studentIds.filter(id=>student(id) && !summarySent(s,id));
    if(miss.length) out.push({s,miss});
  });
  return out.sort((a,b)=>b.s.date.localeCompare(a.s.date));
}
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

];
function renderNav(route){

  $('#nav').innerHTML = NAV.map(([k,l,ic,bg])=>`<a href="#${k}" class="${route===k||(route==='student'&&k==='students')?'on':''}"><span class="ic" style="background:${bg}">${ic}</span>${l}${k==='mail'&&pend?`<span class="count">${pend}</span>`:''}</a>`).join('');

function route(){
  const [r,arg] = (location.hash.slice(1)||'dashboard').split('/');

function vDashboard(){

  // revenue chart last 6 months

  return header(`${hello}${name?', '+esc(name):''} 👋`, `${fdateLong(todayISO())} · הנה תמונת המצב שלך`,

function sessionItem(s){
  const d = pd(s.date);
  const studs = s.studentIds.map(student).filter(Boolean);

  const m = moduleById(s.moduleId);
  return `<div class="item">
    <div class="datechip"><b>${d.getDate()}</b><small>${HM[d.getMonth()].slice(0,3)}׳</small></div>
    <div class="grow"><div class="t">${m?`<span class="muted small">סשן ${m.num} · </span>`:''}${esc(sessTitle(s))}</div>

    ${s.status==='done'?(sentAll?'<span class="badge b-lav">✓ סיכום נשלח</span>':'<span class="badge b-pink">סיכום לא נשלח</span>'):''}

let sessFilter='all';
function vSessions(){
  let list = [...db.sessions];
  if(sessFilter==='planned') list=list.filter(s=>s.status==='planned');
  if(sessFilter==='done') list=list.filter(s=>s.status==='done');
  if(sessFilter==='unsent') list=list.filter(s=>s.status==='done'&&s.studentIds.some(id=>!summarySent(s,id)));
  if(sessFilter==='unpaid') list=list.filter(s=>['open','partial'].includes(sessionPayState(s)));
  const planned = list.filter(s=>s.status==='planned').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

let billMonth = 'all';
function vBilling(){
  const months = [...new Set(db.sessions.filter(s=>s.status==='done').map(s=>s.date.slice(0,7)))].sort().reverse();

     <div class="kpi k2"><div class="lbl">שולם</div><div class="val">${money(T.p)}</div><div class="sub">${T.c?Math.round(T.p/T.c*100):0}% גבייה</div></div>
     <div class="kpi k4"><div class="lbl">יתרה פתוחה</div><div class="val">${money(T.c-T.p)}</div></div>

   ${rows.map(r=>`<tr><td><div class="row" style="gap:10px;flex-wrap:nowrap">${avatar(r.st)}<a href="#student/${r.st.id}" style="text-decoration:none;font-weight:600">${esc(r.st.name)}</a></div></td>
     <td class="num">${r.n}</td><td class="num hide-m">${money(r.charged)}</td><td class="num" style="color:var(--mint-d)">${money(r.paid)}</td>
     <td class="num"><b style="color:${r.bal>0?'var(--peach-d)':'var(--mint-d)'}">${money(r.bal)}</b></td>
     <td><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">${r.bal>0?`<button class="btn sm mint" data-act="payAll" data-id="${r.st.id}">✓ סימון כשולם</button>`:''}<button class="btn sm" data-act="mailStatement" data-id="${r.st.id}">✉ סיכום חשבון</button></div></td></tr>`).join('')}
   </tbody></table>`:`<div class="empty"><div class="big">🧾</div>עוד אין סשנים שהועברו בתקופה הזו</div>`}</div>`;
}

function modal(html){
  closeModal();
  const ov = document.createElement('div'); ov.className='ov'; ov.id='ov';
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
  const f = ov.querySelector('input,textarea,select'); f && f.focus();
}
function closeModal(){ $('#ov')?.remove(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function saveSession(id, thenMail){
  const studentIds=[...document.querySelectorAll('#f_studs input:checked')].map(i=>i.value);
  const status=document.querySelector('#f_status button.on')?.dataset.v||'planned';
  const paid={}; document.querySelectorAll('#f_paid input').forEach(i=>{ if(i.checked) paid[i.value]=true; });
  const data={date:val('f_date')||todayISO(),time:val('f_time'),duration:+val('f_dur')||90,moduleId:val('f_mod'),title:val('f_title'),studentIds,status,price:+val('f_price')||0,
    highlights:val('f_high').split('\n').map(x=>x.trim()).filter(Boolean),homework:val('f_hw'),notes:val('f_notes')};
  let s;
  if(id){ s=sessionById(id); const old=s.paid||{}; Object.assign(s,data); s.paid={}; studentIds.forEach(x=>{ if(paid[x]||(old[x]&&!document.querySelector(`#f_paid input[value="${x}"]`))) s.paid[x]=true; }); }
  else { s={id:uid(),...data,paid}; db.sessions.push(s); }
  save(); closeModal();
  if(thenMail && s.status==='done'){ openMail({type:'summary',sessionId:s.id}); return; }
  rerender(); toast('הסשן נשמר ✓');
}
function delSession(id){ if(!confirm('למחוק את הסשן?')) return; db.sessions=db.sessions.filter(s=>s.id!==id); db.mails=db.mails.filter(m=>m.sessionId!==id); save(); closeModal(); rerender(); }

/* ============ mail center ============ */
let mail = {type:'summary', sessionId:'', studentIds:[], note:'', subject:'', subjectEdited:false, bcc:true};
const MAIL_TYPES = [['summary','סיכום סשן','💌'],['statement','סיכום חשבון','🧾'],['reminder','תזכורת לסשן','⏰'],['welcome','ברוכים הבאים','🌷']];
function mailTypeBadge(t){ const c={summary:'b-pink',statement:'b-mint',reminder:'b-sky',welcome:'b-lav'}[t]; const l=MAIL_TYPES.find(x=>x[0]===t); return `<span class="badge ${c}">${l?l[2]+' '+l[1]:t}</span>`; }
function openMail(opts){
  mail = {type:'summary',sessionId:'',studentIds:[],note:'',subject:'',subjectEdited:false,bcc:true,...opts};
  if(mail.type==='summary' && mail.sessionId && !opts.studentIds){ const s=sessionById(mail.sessionId); const miss=s.studentIds.filter(id=>!summarySent(s,id)); mail.studentIds = miss.length?miss:[...s.studentIds]; }
  if(location.hash==='#mail') route(); else location.hash='mail';
}
function vMail(){
  const done = db.sessions.filter(s=>s.status==='done').sort((a,b)=>b.date.localeCompare(a.date));
  const planned = db.sessions.filter(s=>s.status==='planned').sort((a,b)=>a.date.localeCompare(b.date));

function sendMailto(){
  const r = mailCheck(); if(!r) return;
  const d=document.createElement('div'); d.innerHTML=r.html; d.style.cssText='position:fixed;left:-9999px'; document.body.appendChild(d); let body=d.innerText.replace(/\n{3,}/g,'\n\n'); d.remove();
  if(body.length>1800) body=body.slice(0,1800)+'\n...';
  const a = addrs(r);
  location.href = `mailto:${encodeURIComponent(a.to)}?${a.bcc?'bcc='+encodeURIComponent(a.bcc)+'&':''}subject=${encodeURIComponent(r.subject)}&body=${encodeURIComponent(body)}`;
  logMail(r);
}
function markSent(){ const r=mailCheck(); if(!r) return; logMail(r); toast('סומן כנשלח ✓'); }
function logMail(r){
  db.mails.push({id:uid(),date:new Date().toISOString(),type:mail.type,sessionId:mail.sessionId||'',studentIds:r.rec.map(s=>s.id),subject:r.subject});
  save(); setTimeout(rerender,300);
}
function unlogMail(id){ db.mails=db.mails.filter(m=>m.id!==id); save(); rerender(); toast('הסימון בוטל'); }

/* ============ actions ============ */
const ACTIONS = {
  newStudent:()=>studentForm(),
  editStudent:id=>studentForm(student(id)),
  newSession:id=>sessionForm({},id),
  editSession:id=>sessionForm(JSON.parse(JSON.stringify(sessionById(id)))),
  mailSession:(id,el)=>openMail({type:'summary',sessionId:id,...(el.dataset.sid?{studentIds:[el.dataset.sid]}:{})}),
  mailStatement:id=>openMail({type:'statement',studentIds:[id]}),
  payAll:id=>{ if(!confirm('לסמן את כל הסשנים של המשתתף כשולמו?')) return; db.sessions.forEach(s=>{ if(s.status==='done'&&s.studentIds.includes(id)&&(billMonth==='all'||s.date.startsWith(billMonth))){ s.paid=s.paid||{}; s.paid[id]=true; } }); save(); rerender(); toast('סומן כשולם ✓'); },
  editModule:id=>moduleForm(id?moduleById(id):null),
  resetModules:()=>{ if(!confirm('לשחזר את תוכנית הלימוד המקורית? שינויים שעשית בנושאים יימחקו.')) return; db.modules=defaultModules(); save(); rerender(); },
  saveSettings:()=>{ ['instructor','business','email','phone','site','payment','signature'].forEach(k=>db.settings[k]=val('s_'+k)); db.settings.price=+val('s_price')||0; save(); rerender(); toast('ההגדרות נשמרו ✓'); },
  exportData:()=>{ const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`claude-studio-backup-${todayISO()}.json`; a.click(); },
  demo:()=>{ if((db.students.length||db.sessions.length) && !confirm('זה יחליף את הנתונים הקיימים בנתוני דוגמה. להמשיך?')) return; loadDemo(); },
  wipe:()=>{ if(!confirm('למחוק את כל הנתונים? כדאי להוריד גיבוי קודם.')) return; if(!confirm('בטוח? אי אפשר לבטל את זה.')) return; db=defaults(); save(); location.hash='dashboard'; rerender(); },
};
document.addEventListener('click', e=>{ const a=e.target.closest('[data-act]'); if(!a) return; e.preventDefault(); ACTIONS[a.dataset.act]?.(a.dataset.id, a, e); });
function importData(file){ if(!file) return; const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.students||!d.sessions) throw 0; if(!confirm('לשחזר מהגיבוי? הנתונים הנוכחיים יוחלפו.')) return; db={...defaults(),...d}; save(); rerender(); toast('השחזור הצליח ✓'); }catch(e){ toast('הקובץ לא תקין'); } }; fr.readAsText(file); }
