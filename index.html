<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספיד Automation · ניהול סשנים</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F5; --card:#FFFFFF; --ink:#1E1B1A; --muted:#857C75; --line:#F0E8E1; --soft:#F8F2EC;
  --lav:#FFE6D5; --lav-d:#E8620C; --mint:#DDF3E6; --mint-d:#2E8A5B; --peach:#FFEBC8; --peach-d:#B06A00;
  --pink:#FDE1DA; --pink-d:#C24B37; --sky:#E2EEF8; --sky-d:#3B76A8; --butter:#FFF3CC; --butter-d:#9A7410;
  --r:18px; --shadow:0 1px 2px rgba(40,30,25,.04),0 8px 24px rgba(232,98,12,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo','Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* sidebar */
.side{background:linear-gradient(180deg,#FFFBF8 0%,#FBF2EA 100%);border-left:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);padding:6px}.logo img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:#4A403A;font-weight:500;transition:.15s}
.nav a:hover{background:#FDEEE3}
.nav a.on{background:#fff;color:var(--lav-d);box-shadow:var(--shadow)}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px}
.nav .count{margin-inline-start:auto;background:var(--pink);color:var(--pink-d);font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-radius:12px;background:#fff8;border:1px dashed var(--line)}
/* main */
main{padding:28px 34px 60px;max-width:1280px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;letter-spacing:-.3px}
.top p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:500;cursor:pointer;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:.15s;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{box-shadow:inset 0 0 0 1px #F3D9C6;background:#FFFCFA}
.btn.pri{background:var(--lav-d);color:#fff;box-shadow:0 6px 16px rgba(232,98,12,.25)}
.btn.pri:hover{background:#CF560A}
.btn.mint{background:var(--mint);color:var(--mint-d);box-shadow:none}
.btn.pink{background:var(--pink);color:var(--pink-d);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.danger{color:#C2415B}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid #F3ECE6}
.card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.4fr 1fr}
.kpi{padding:18px 20px;border-radius:var(--r);position:relative;overflow:hidden}
.kpi .lbl{font-size:13px;font-weight:500;opacity:.85}
.kpi .val{font-size:30px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .sub{font-size:12px;opacity:.75;margin-top:2px}
.kpi .emo{position:absolute;left:16px;top:14px;font-size:24px;opacity:.9}
.k1{background:var(--lav);color:#A2440A}.k2{background:var(--mint);color:#1D6B4B}.k3{background:var(--sky);color:#235B8A}.k4{background:var(--peach);color:#9A4A26}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--soft);border:1px solid transparent;transition:.15s}
.item:hover{border-color:#F6DCCB;background:#FDF3EC}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.datechip{width:52px;min-width:52px;text-align:center;border-radius:12px;background:#fff;padding:6px 0;box-shadow:var(--shadow)}
.datechip b{display:block;font-size:19px;line-height:1.1}
.datechip small{font-size:11px;color:var(--muted)}
.av{width:34px;height:34px;min-width:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;border:2px solid #fff}
.avs{display:flex}.avs .av{margin-inline-start:-8px;width:28px;height:28px;min-width:28px;font-size:11px}.avs .av:first-child{margin:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-lav{background:var(--lav);color:var(--lav-d)}.b-mint{background:var(--mint);color:var(--mint-d)}.b-peach{background:var(--peach);color:var(--peach-d)}.b-pink{background:var(--pink);color:var(--pink-d)}.b-sky{background:var(--sky);color:var(--sky-d)}.b-butter{background:var(--butter);color:var(--butter-d)}.b-gray{background:#EFEDF5;color:#6C6886}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
/* table */
table.tb{width:100%;border-collapse:separate;border-spacing:0}
.tb th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:8px 12px;border-bottom:1px solid var(--line)}
.tb td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr:hover td{background:#FFFBF8}
.num{font-variant-numeric:tabular-nums}
/* students */
.scard{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.15s}
.scard:hover{transform:translateY(-2px)}
.scard .hd{display:flex;gap:12px;align-items:center}
.scard .av{width:46px;height:46px;font-size:16px}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFB27A,#FF7A2F)}
.muted{color:var(--muted)}
.small{font-size:13px}
/* inputs */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:#4A403A}
.in{width:100%;border:1px solid var(--line);background:#FFFCFA;border-radius:12px;padding:10px 12px;outline:none;transition:.15s}
.in:focus{border-color:#F4B48A;background:#fff;box-shadow:0 0 0 4px #FDEBDD}
textarea.in{min-height:84px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:var(--soft);cursor:pointer;font-size:14px;border:1px solid transparent;user-select:none}
.chk input{accent-color:var(--lav-d)}
.chk:has(input:checked){background:var(--lav);border-color:#F8C9A8;color:#A2440A}
.search{max-width:280px}
.tabs{display:inline-flex;background:#fff;border-radius:12px;padding:4px;box-shadow:inset 0 0 0 1px var(--line);gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--lav);color:var(--lav-d)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(40,30,25,.28);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:22px;width:100%;max-width:640px;padding:26px;box-shadow:0 30px 80px rgba(40,30,25,.25);animation:pop .18s}
.modal h2{margin:0 0 18px;font-size:20px}
.modal .acts{display:flex;justify-content:flex-start;gap:10px;margin-top:8px;flex-direction:row}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .2s;font-size:14px}
/* chart */
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .stack{width:100%;max-width:42px;display:flex;flex-direction:column-reverse;border-radius:10px;overflow:hidden;background:var(--soft);height:100%;justify-content:flex-start}
.bar .paid{background:#BFE9D5}.bar .open{background:#FFD0BA}
.bar small{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* matrix */
.mx{overflow:auto}
.mx table{border-collapse:separate;border-spacing:6px}
.mx th{font-size:12px;color:var(--muted);font-weight:500;padding:4px;white-space:nowrap}
.mx td.c{width:38px;height:38px;border-radius:10px;text-align:center;background:var(--soft);font-size:15px}
.mx td.c.y{background:var(--mint);color:var(--mint-d);font-weight:700}
.mx td.c.p{background:var(--butter);color:var(--butter-d)}
.mx td.nm{white-space:nowrap;font-weight:500;padding-inline-end:10px}
/* modules */
.mod{border-radius:var(--r);padding:18px;background:#fff;box-shadow:var(--shadow);border:1px solid #F3ECE6;display:flex;flex-direction:column;gap:10px}
.mod .n{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700}
.mod ul{margin:0;padding-inline-start:18px;color:#4A403A;font-size:14px}
code,.code{font-family:Consolas,'Cascadia Code',monospace;background:#FCEDE2;color:#C2520A;padding:2px 7px;border-radius:7px;font-size:13px;direction:ltr;display:inline-block}
/* mail */
.mailgrid{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.cloud{font-weight:600;margin-bottom:4px}.cloud.ok{color:var(--mint-d)}.cloud.saving{color:var(--muted)}.cloud.error{color:#C2415B}
.attach{display:flex;align-items:center;gap:6px;background:var(--lav);color:#A2440A;border-radius:12px;padding:9px 14px;font-size:14px}
.preview{background:#F5EEE8;border-radius:var(--r);padding:22px;max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:20px}
.preview .bar2{display:flex;gap:6px;margin-bottom:12px;align-items:center;color:var(--muted);font-size:12px}
.preview .bar2 i{width:10px;height:10px;border-radius:50%;background:#EBDCD0;display:inline-block}
.hint{font-size:12.5px;color:var(--muted);background:var(--butter);border-radius:12px;padding:10px 12px;line-height:1.55}
.hint b{color:var(--butter-d)}
.sep{height:1px;background:var(--line);margin:16px 0}
.pill-num{font-weight:700;font-size:20px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.mailgrid{grid-template-columns:1fr}.preview{position:static;max-height:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:40;padding:8px;border-left:0;border-top:1px solid var(--line);background:#fff}
  .brand,.side .foot,.side>.btn{display:none}
  .nav{display:flex;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px}
  .nav .count{display:none}
  main{padding:20px 14px 100px;min-width:0;overflow-x:hidden}
  .kpi{padding:14px}.kpi .val{font-size:22px}.kpi .emo{display:none}
  .item{flex-wrap:wrap;gap:10px}.item .grow{flex-basis:60%}
  .avs.hide-m{display:none}
  .grid{min-width:0}.card{min-width:0;overflow-x:auto}
  .g2,.g3,.f2,.f3{grid-template-columns:1fr}
  .tb .hide-m{display:none}
}
@media print{.side,.top .row{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><img src="logo.png" alt="ספיד Automation"></div><div><b id="brandName">ספיד Automation</b><small>ניהול סשנים ודיוורים</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div id="cloudState" class="cloud off">💾 נשמר רק בדפדפן הזה</div>כדאי לגבות מדי פעם.
      <div class="row" style="gap:6px;margin-top:8px"><button class="btn sm" data-act="exportData">⬇ גיבוי</button><label class="btn sm">⬆ שחזור<input type="file" accept=".json" hidden onchange="importData(this.files[0])"></label></div></div>
    <a class="btn ghost sm" href="/logout" style="justify-content:center">⎋ יציאה</a>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ============ data ============ */
const KEY = 'cc-studio-v1';
const PASTELS = [['#FFE6D5','#C2520A'],['#D3F2E4','#1D6B4B'],['#FFE3D4','#9A4A26'],['#FDE1DA','#9E3366'],['#D8ECFC','#235B8A'],['#FFF3CC','#7D5E0A']];

function defaultModules(){
  // The program's sessions. Edit content here; tools/build-summaries.cjs builds a summary page + PDF per session from it.
  return [
    {id:'m0',num:1,title:'הקמה, חיבור לגיט ואתר תדמית ראשון',goal:'להתקין הכל, להתחבר ולבנות אתר ראשון כבר בסשן הראשון',
      headline:'התחלנו לעבוד עם Claude Code', short:'הקמה ואתר ראשון', product:'אתר תדמית ראשוני',

      steps:[
        {t:'התקנו את אפליקציית Claude',d:'הורדנו מהאתר הרשמי, התקנו במחשב והתחברנו לחשבון.',links:['claude.com/download']},
        {t:'התחברנו ל-Git ול-GitHub',d:'התקנו את Git, התחברנו לחשבון GitHub ויצרנו ריפו ריק לפרויקט. ככה כל עבודה נשמרת בענן עם היסטוריה מלאה.',links:['git-scm.com','github.com/new']},
        {t:'ראינו דוגמה לאתר דמו',d:'הסתכלנו על אתר שנבנה כולו עם Claude Code, כדי לראות מה אפשר להשיג ואיך נראה התהליך מבפנים.'},
        {t:'נרשמנו ל-Claude Code',d:'הפעלנו מנוי בתשלום (Pro ומעלה), כי בלעדיו אין גישה ללשונית Code. אחר כך פתחנו את הלשונית ובחרנו תיקייה לפרויקט.',links:['claude.com/pricing']},
        {t:'יצרנו אתר תדמית ראשוני',d:'כתבנו פרומפט עם פרטי העסק, ו-Claude בנה את הגרסה הראשונה של האתר. אחר כך ביקשנו תיקונים וראינו את התוצאה בדפדפן.'}],
      have:['אפליקציית Claude מותקנת ומחוברת','Git מותקן וחשבון GitHub פעיל','מנוי פעיל ל-Claude Code','תיקיית פרויקט עם אתר תדמית ראשוני'],
      next:['להשלים טקסטים, תמונות ולוגו באתר','לבדוק את האתר גם בטלפון','לבקש מ-Claude: "תעלה את השינויים לגיט"','לחבר את הריפו ל-Vercel ולפרסם (vercel.com/new)'],
      prompt:'אני רוצה [מה לשנות או להוסיף] באתר.\nהמטרה: [למה זה חשוב, מה הגולש צריך להרגיש או לעשות].\nסגנון: [צבעים / תחושה / דוגמה שאהבתי].\nלפני שאתה מתחיל, תציג לי תוכנית קצרה. אל תעלה לגיט עד שאאשר.',
      tip:'כדאי לבקש שינוי אחד בכל הודעה ולבדוק אותו בדפדפן לפני שממשיכים. ככה קל לראות מה עבד ולתקן מהר.'},

    {id:'m1',num:2,title:'העמקה: סקילים, פקודות ועבודה חכמה',goal:'להכיר את הכלים שהופכים את Claude Code לעוזר שעובד בדיוק כמו שאת רוצה',
      headline:'מכירים לעומק את Claude Code', short:'סקילים ופקודות', product:'סקיל ראשון משלך',
      lead:'תודה על הסשן! הפעם העמקנו ביכולות של Claude Code: פקודות, זיכרון, מצב תכנון, סקילים וחיבורים לכלים חיצוניים. ריכזתי כאן הכל כדי שיהיה קל לחזור ולתרגל.',
      steps:[
        {t:'פקודות סלאש',d:'פקודות שמתחילות ב-/ וחוסכות זמן: ניקוי שיחה, דחיסת שיחה ארוכה, חזרה לשיחה קודמת ובחירת מודל.',links:['/clear','/compact','/resume','/model']},
        {t:'CLAUDE.md: הזיכרון של הפרויקט',d:'קובץ שבו כותבים ל-Claude כללים קבועים: סגנון, צבעים, מה מותר ומה אסור. הפקודה /init יוצרת אותו לבד, ומאז Claude קורא אותו בכל פעם.',links:['/init','CLAUDE.md']},
        {t:'מצב תכנון והרשאות',d:'עם Shift+Tab עוברים בין מצבי עבודה. במצב תכנון Claude קודם מציג תוכנית, ורק אחרי אישור מתחיל לבנות. ככה שולטים במה שהוא עושה לבד.',links:['Shift+Tab']},
        {t:'סקילים (Skills)',d:'סקיל הוא "מתכון" מוכן למשימה חוזרת, למשל סיכום פגישה או יצירת פוסט. Claude משתמש בו לבד כשזה רלוונטי, או שמפעילים אותו עם / ושם הסקיל.',links:['/שם-הסקיל']},

/* ============ cloud sync (api/data.js, Upstash) ============
   The browser keeps a copy in localStorage; the cloud copy is the source of truth.
   On load we pull from the cloud (or upload this browser's data the first time),
   every save is pushed (debounced), and coming back to the tab pulls changes made elsewhere. */
const CLOUD_V = 'cc-studio-cloud-v';
const cloud = {
  state:'off', v:+(localStorage.getItem(CLOUD_V)||0), timer:null, busy:false, again:false,
  setV(v){ this.v=v; try{ localStorage.setItem(CLOUD_V,String(v)); }catch(e){} },
  status(st){ this.state=st; const el=document.getElementById('cloudState'); if(!el) return;
    el.textContent = {ok:'☁️ נשמר בענן', saving:'☁️ שומר...', error:'⚠ לא נשמר בענן', off:'💾 נשמר רק בדפדפן הזה'}[st]||'';
    el.className='cloud '+st; },
  adopt(remote, v){ db = {...defaults(), ...remote, modules:defaultModules(), settings:{...defaults().settings, ...(remote.settings||{})}}; this.setV(v); saveLocal(); },
  async pull(first){
    try{
      const r = await fetch('/api/data',{cache:'no-store'});
      if(!r.ok){ this.status(r.status===503||r.status===404?'off':'error'); return; }
      const d = await r.json();
      if(d.db && first && !this.v && (db.students.length||db.sessions.length)){
        // this browser never synced but has its own data: merge it into the cloud copy instead of losing it
        const byId=(x,y)=>{ const m=new Map((x||[]).map(o=>[o.id,o])); (y||[]).forEach(o=>{ if(!m.has(o.id)) m.set(o.id,o); }); return [...m.values()]; };
        const local=db; this.adopt(d.db, d.v);
        db.students=byId(db.students,local.students); db.sessions=byId(db.sessions,local.sessions); db.mails=byId(db.mails,local.mails);
        saveLocal(); rerender(); this.status('saving'); await this.push();
      }
      else if(d.db){ if(d.v!==this.v || first){ this.adopt(d.db, d.v); rerender(); } this.status('ok'); }
      else if(db.students.length||db.sessions.length){ this.status('saving'); await this.push(); } // first time: upload this browser's data
      else this.status('ok');
    }catch(e){ this.status('error'); }
  },
  queue(){ if(this.state==='off') return; clearTimeout(this.timer); this.status('saving'); this.timer=setTimeout(()=>this.push(),700); },
  async push(){
    this.timer=null;
    if(this.busy){ this.again=true; return; }
    this.busy=true;
    try{
      const r = await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({db,v:this.v})});
      const d = await r.json().catch(()=>({}));
      if(r.status===409 && d.db){ this.adopt(d.db, d.v); rerender(); toast('הנתונים עודכנו ממחשב אחר. כדאי לבדוק ולעשות את השינוי האחרון שוב.'); this.status('ok'); }
      else if(r.ok){ this.setV(d.v); this.status('ok'); }
      else this.status('error');
    }catch(e){ this.status('error'); }
    this.busy=false;
    if(this.again){ this.again=false; this.push(); }
  },
};
window.addEventListener('focus', ()=>{ if(cloud.state==='ok' && !cloud.busy && !cloud.timer) cloud.pull(false); });
window.addEventListener('beforeunload', e=>{ if(cloud.state==='saving'){ e.preventDefault(); e.returnValue=''; } });

function fdateLong(iso){ if(!iso) return ''; const d=pd(iso); return `יום ${HD[d.getDay()]}, ${d.getDate()} ב${HM[d.getMonth()]}`; }
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('');
function colorOf(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return PASTELS[h%PASTELS.length]; }
function avatar(s){ const [bg,fg]=colorOf(s.id); return `<span class="av" style="background:${bg};color:${fg}" title="${esc(s.name)}">${esc(initials(s.name))}</span>`; }

function endTime(s){ if(!s.time) return ''; const [h,m]=s.time.split(':').map(Number); const e=h*60+m+(+s.duration||0); return String(Math.floor(e/60)%24).padStart(2,'0')+':'+String(e%60).padStart(2,'0'); }
const timeRange = s => s.time ? `${s.time}–${endTime(s)}` : '';
const hrs = min => { const h=(+min||0)/60; return (Math.round(h*100)/100).toLocaleString('he-IL')+(h===1?' שעה':' שעות'); };

function studentStats(sid){
  const ss = db.sessions.filter(s=>s.studentIds.includes(sid));
  const done = ss.filter(s=>s.status==='done');
  const charged = done.reduce((a,s)=>a+(+s.price||0),0);
  const paid = done.filter(s=>s.paid?.[sid]).reduce((a,s)=>a+(+s.price||0),0);
  const mods = new Set(done.map(s=>s.moduleId).filter(Boolean));
  const next = ss.filter(s=>s.status==='planned').sort((a,b)=>a.date.localeCompare(b.date))[0];
  const last = done.sort((a,b)=>b.date.localeCompare(a.date))[0];
  return {all:ss, done, charged, paid, balance:charged-paid, mods, next, last};
}
function summarySent(sess, sid){ return db.mails.some(m=>m.type==='summary' && m.sessionId===sess.id && m.studentIds.includes(sid)); }
function sessionPayState(s){
  if(s.status!=='done' || !s.studentIds.length) return null;
  const n = s.studentIds.filter(id=>s.paid?.[id]).length;
  return n===s.studentIds.length ? 'paid' : n ? 'partial' : 'open';
}
function pendingSummaries(){
  const out=[];
  db.sessions.filter(s=>s.status==='done').forEach(s=>{
    const miss = s.studentIds.filter(id=>student(id) && !summarySent(s,id));
    if(miss.length) out.push({s,miss});
  });
  return out.sort((a,b)=>b.s.date.localeCompare(a.s.date));
}
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

let sessFilter='all';
function vSessions(){
  let list = [...db.sessions];

let billMonth = 'all';
function vBilling(){
  const HMs = m => { const [y,mo]=m.split('-').map(Number); return HM[mo-1]+' '+y; };
  const months = [...new Set(db.sessions.filter(s=>s.status==='done').map(s=>s.date.slice(0,7)))].sort().reverse();
  if(billMonth!=='all' && !months.includes(billMonth)) billMonth='all';
  const inM = s => s.status==='done' && (billMonth==='all' || s.date.startsWith(billMonth));
  // one line per client per session
  const lines = [];
  db.sessions.filter(inM).forEach(s=>s.studentIds.forEach(id=>{ const st=student(id); if(st) lines.push({s,st,price:+s.price||0,paid:!!s.paid?.[id]}); }));
  const charged = lines.reduce((a,l)=>a+l.price,0), paid = lines.filter(l=>l.paid).reduce((a,l)=>a+l.price,0);
  const open = lines.filter(l=>!l.paid).sort((a,b)=>a.s.date.localeCompare(b.s.date));
  const byClient = db.students.map(st=>{ const ls=lines.filter(l=>l.st.id===st.id); const c=ls.reduce((a,l)=>a+l.price,0), p=ls.filter(l=>l.paid).reduce((a,l)=>a+l.price,0); return {st,n:ls.length,c,p,bal:c-p}; })
    .filter(r=>r.n).sort((a,b)=>b.bal-a.bal || a.st.name.localeCompare(b.st.name));
  return header('תשלומים', billMonth==='all'?'כל הסשנים שהועברו':'סשנים שהועברו ב'+HMs(billMonth)) +
  `<div class="row" style="margin-bottom:18px"><div class="tabs">${[['all','הכל'],...months.slice(0,6).map(m=>[m,HMs(m)])].map(([k,l])=>`<button class="${billMonth===k?'on':''}" onclick="billMonth='${k}';rerender()">${l}</button>`).join('')}</div></div>
  <div class="grid g4" style="margin-bottom:18px">
    <div class="kpi k1"><div class="lbl">סה״כ חויב</div><div class="val">${money(charged)}</div><div class="sub">${lines.length} סשנים</div></div>
    <div class="kpi k2"><div class="lbl">שולם</div><div class="val">${money(paid)}</div><div class="sub">${lines.length-open.length} סשנים</div></div>
    <div class="kpi k4"><div class="lbl">ממתין לתשלום</div><div class="val">${money(charged-paid)}</div><div class="sub">${open.length} סשנים</div></div>
    <div class="kpi k3"><div class="lbl">לקוחות עם יתרה</div><div class="val">${byClient.filter(r=>r.bal>0).length}</div><div class="sub">מתוך ${byClient.length}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>⏳ ממתינים לתשלום</h3>
      ${open.length?`<table class="tb"><thead><tr><th>תאריך</th><th>לקוח</th><th class="hide-m">נושא</th><th>סכום</th><th></th></tr></thead><tbody>
      ${open.map(l=>`<tr><td class="num">${fdate(l.s.date)}</td><td><a href="#student/${l.st.id}" style="text-decoration:none;font-weight:600">${esc(l.st.name)}</a></td><td class="hide-m small muted">${esc(sessTitle(l.s))}</td><td><b>${money(l.price)}</b></td>
        <td><button class="btn sm mint" onclick="togglePaid('${l.s.id}','${l.st.id}',true)">✓ שולם</button></td></tr>`).join('')}</tbody></table>`
      :'<div class="empty small"><div class="big">🌿</div>הכל שולם, אין תשלומים פתוחים</div>'}
    </div>
    <div class="card"><h3>👤 לפי לקוח</h3>
      ${byClient.length?`<div class="list">${byClient.map(r=>`<div class="item">${avatar(r.st)}<div class="grow"><div class="t">${esc(r.st.name)}</div><div class="s">${r.n} סשנים · שולם ${money(r.p)} מתוך ${money(r.c)}</div></div>
        ${r.bal>0?`<span class="badge b-peach">יתרה ${money(r.bal)}</span><button class="btn sm" data-act="payAll" data-id="${r.st.id}">✓ הכל שולם</button>`:'<span class="badge b-mint">הכל שולם</span>'}</div>`).join('')}</div>`
      :'<div class="empty small">עוד אין סשנים שהועברו</div>'}
    </div>
  </div>
  <div class="hint" style="margin-top:14px">המחיר נקבע בכל סשן (בעריכת הסשן). אפשר לסמן תשלום גם מדף הלקוח.</div>`;
}

/* ============ modals ============ */
function modal(html){
  closeModal();
  const ov = document.createElement('div'); ov.className='ov'; ov.id='ov';
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
  const f = ov.querySelector('input,textarea,select'); f && f.focus();
}
function closeModal(){ $('#ov')?.remove(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function saveStudent(id){
  const name=val('f_name'); if(!name) return toast('צריך למלא שם');
  const email=val('f_email');
  if(email && !/^[^\s@<>,]+@[^\s@<>,]+\.[^\s@<>,]+$/.test(email)) return toast('כתובת המייל לא נראית תקינה');
  const data={name,email,phone:val('f_phone'),business:val('f_business'),site:val('f_site'),status:val('f_status'),notes:val('f_notes')};
  if(id) Object.assign(student(id),data); else db.students.push({id:uid(),created:todayISO(),...data});
  save(); closeModal(); rerender(); toast('נשמר ✓');
}
function delStudent(id){
  if(!confirm('למחוק את הלקוח? הוא יוסר גם מהסשנים.')) return;
  db.students=db.students.filter(s=>s.id!==id);
  db.sessions.forEach(s=>s.studentIds=s.studentIds.filter(x=>x!==id));
  save(); closeModal(); location.hash='students'; rerender();
}

function saveSession(id, thenMail){
  const studentIds=[...document.querySelectorAll('#f_studs input:checked')].map(i=>i.value);
  const status=document.querySelector('#f_status button.on')?.dataset.v||'planned';
  const paid={}; document.querySelectorAll('#f_paid input').forEach(i=>{ if(i.checked) paid[i.value]=true; });
  const data={date:val('f_date')||todayISO(),time:val('f_time'),duration:+val('f_dur')||90,moduleId:val('f_mod'),title:val('f_title'),studentIds,status,price:+val('f_price')||0,
    highlights:val('f_high').split('\n').map(x=>x.trim()).filter(Boolean),homework:val('f_hw'),notes:val('f_notes')};
  let s;
  if(id){ s=sessionById(id); const old=s.paid||{}; Object.assign(s,data); s.paid={}; studentIds.forEach(x=>{ if(paid[x]||(old[x]&&!document.querySelector(`#f_paid input[value="${x}"]`))) s.paid[x]=true; }); }
  else { s={id:uid(),...data,paid}; db.sessions.push(s); }
  save(); closeModal();
  if(thenMail && s.status==='done'){ openMail({type:'summary',sessionId:s.id}); return; }
  rerender(); toast('הסשן נשמר ✓');
}
function delSession(id){ if(!confirm('למחוק את הסשן?')) return; db.sessions=db.sessions.filter(s=>s.id!==id); db.mails=db.mails.filter(m=>m.sessionId!==id); save(); closeModal(); rerender(); }
function togglePaid(sessId, sid, on){ const s=sessionById(sessId); s.paid=s.paid||{}; if(on) s.paid[sid]=true; else delete s.paid[sid]; save(); rerender(); toast(on?'סומן כשולם ✓':'הסימון בוטל'); }

let mail = {sessionId:'', studentIds:[], note:'', subject:'', subjectEdited:false, extra:''};

        ${sess&&sess.studentIds.some(id=>summarySent(sess,id))?'<div class="muted small" style="margin-top:6px">✓ = כבר קיבלו את הסיכום</div>':''}</div>
      <div class="field"><label>✉ שליחה למייל נוסף (לא חובה)</label><input class="in" id="m_extra" type="text" inputmode="email" dir="ltr" placeholder="name@example.com" value="${esc(mail.extra)}" oninput="mail.extra=this.value;mailPreview()">
        <div class="muted small" style="margin-top:6px">אפשר כמה כתובות עם פסיק ביניהן. למשל לעצמך, לבדיקה.</div></div>

function mailMount(){ mailPreview(); }
function mailToggle(id,on){ mail.studentIds = on?[...new Set([...mail.studentIds,id])]:mail.studentIds.filter(x=>x!==id); mail.subjectEdited||(mail.subject=''); rerender(); }
function mailRecipients(){ return mail.studentIds.map(student).filter(Boolean); }
function mailPreview(){
  const box=$('#m_preview'); if(!box) return;

}

/* email building blocks: tables + inline styles, in the design of the session-summary page */
const C = {orange:'#FF6B0F', orangeSoft:'#FFF1E7', orangeLine:'#FFD3B5', ink:'#141414', ink2:'#3B3B3B', muted:'#6E6E6E', line:'#ECE7E2', bg:'#FBF9F7', ok:'#1F9D63', okSoft:'#E8F7EF'};
const E = {
  font:"font-family:Heebo,'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Hebrew',Roboto,'Noto Sans Hebrew','Helvetica Neue',Arial,sans-serif;",
  logo(){ return new URL('/logo.png', location.href).href; },
  wrap(inner){ return `<div dir="rtl" style="background:${C.bg};padding:24px 10px;${E.font}"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;margin:0 auto;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid ${C.line};direction:rtl;text-align:right">
    <tr><td style="padding:20px 30px 16px;border-bottom:2px solid ${C.ink}"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
      <td style="vertical-align:middle;text-align:right"><table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="vertical-align:middle"><img src="${E.logo()}" alt="" width="36" style="display:block;width:36px;height:auto;border:0"></td><td style="vertical-align:middle;padding-right:10px;font-size:18px;font-weight:700;color:${C.ink}">ספיד <span style="color:${C.orange}">Automation</span></td></tr></table></td>
      <td style="vertical-align:middle;text-align:left;font-size:13px;font-weight:700;color:${C.muted}">סיכום סשן</td></tr></table></td></tr>
    <tr><td style="padding:0 30px 26px;text-align:right;${E.font}">${inner}</td></tr></table></div>`; },
  h2(t){ return `<table role="presentation" cellpadding="0" cellspacing="0" style="margin:26px 0 12px"><tr><td style="width:6px;background:${C.orange};border-radius:3px">&nbsp;</td><td style="padding-right:10px;font-size:19px;font-weight:700;color:${C.ink}">${t}</td></tr></table>`; },
  meta(items){ return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>${items.map(([l,v],i)=>`<td style="width:${Math.floor(100/items.length)}%;padding-left:${i<items.length-1?8:0}px;vertical-align:top"><div style="background:#ffffff;border:1px solid ${C.line};border-radius:14px;padding:11px 14px;text-align:right"><div style="font-size:12px;color:${C.muted};font-weight:700">${l}</div><div style="font-size:16px;font-weight:700;color:${C.ink};margin-top:2px">${v}</div></div></td>`).join('')}</tr></table>`; },
  steps(items){ return items.map((x,i)=>`<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:10px"><tr>
      <td style="width:46px;vertical-align:top"><div style="width:34px;height:34px;line-height:34px;border-radius:50%;background:${C.orange};color:#ffffff;font-weight:700;font-size:15px;text-align:center">${i+1}</div></td>
      <td style="background:#ffffff;border:1px solid ${C.line};border-radius:14px;padding:11px 15px;text-align:right">
        <div style="font-size:16px;font-weight:700;color:${C.ink}">${esc(x.t)}</div>
        ${x.d?`<div style="font-size:14px;line-height:1.65;color:${C.ink2};margin-top:2px">${esc(x.d)}</div>`:''}
        ${x.links?.length?`<div style="margin-top:6px">${x.links.map(l=>`<span style="display:inline-block;direction:ltr;font-size:12.5px;background:${C.orangeSoft};border:1px solid ${C.orangeLine};color:#B4520A;border-radius:99px;padding:1px 10px;margin-left:4px">${esc(l)}</span>`).join('')}</div>`:''}
      </td></tr></table>`).join(''); },
  lists(have,next){
    const col=(title,items,mark,color)=>`<div style="background:#ffffff;border:1px solid ${C.line};border-radius:14px;padding:13px 16px;text-align:right"><div style="font-size:15px;font-weight:700;color:${C.ink};margin-bottom:6px">${title}</div>${items.map(t=>`<div style="font-size:14px;line-height:1.6;color:${C.ink2};padding:2px 0"><span style="color:${color};font-weight:700">${mark}</span>&nbsp; ${esc(t)}</div>`).join('')}</div>`;
    const cols=[have.length?col('מה יש לך עכשיו',have,'✓',C.ok):'', next.length?col('הצעדים הבאים',next,'☐',C.orange):''].filter(Boolean);
    if(!cols.length) return '';
    return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:14px"><tr>${cols.map((c,i)=>`<td style="width:${100/cols.length}%;vertical-align:top;padding-left:${i<cols.length-1?10:0}px">${c}</td>`).join('')}</tr></table>`; },
  prompt(t){ return `<div style="background:#ffffff;border:1px solid ${C.line};border-right:5px solid ${C.orange};border-radius:12px;padding:12px 18px;font-size:14.5px;line-height:1.8;color:${C.ink}">${esc(t).replace(/\n/g,'<br>').replace(/\[([^\]]+)\]/g,`<span style="background:${C.orangeSoft};color:#B4520A;border-radius:5px;padding:0 5px;font-weight:700">$1</span>`)}</div>`; },
  tip(t){ return `<div style="background:${C.okSoft};border:1px solid #BFE8D2;border-radius:12px;padding:10px 16px;font-size:14.5px;line-height:1.65;color:${C.ink};margin-top:12px"><b>טיפ:</b> ${esc(t)}</div>`; },
  note(t){ return `<div style="background:${C.orangeSoft};border:1px solid ${C.orangeLine};border-radius:12px;padding:12px 16px;font-size:15px;line-height:1.7;color:${C.ink};margin-top:16px">💬 ${esc(t).replace(/\n/g,'<br>')}</div>`; },
  // payment line for this client and session (only when there's one client and a price)
  payRow(s, rec){
    if(rec.length!==1 || !(+s.price>0)) return '';
    const paid = !!s.paid?.[rec[0].id];
    const [bg, line, color] = paid ? [C.okSoft, '#BFE8D2', C.ok] : [C.orangeSoft, C.orangeLine, '#B4520A'];
    return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:10px"><tr><td style="background:${bg};border:1px solid ${line};border-radius:12px;padding:10px 16px;text-align:right;font-size:15px;color:${C.ink}">
      💳 <b>תשלום על הסשן:</b>&nbsp; <span style="color:${color};font-weight:700">${paid?'✓ שולם':'ממתין לתשלום'}</span>&nbsp; <span style="color:${C.muted}">(<span dir="ltr">${money(s.price)}</span>)</span>
    </td></tr></table>`; },
  // "next session": the planned date if there is one, and what the next topic in the program covers
  nextBox(nextSess, m, s, rec){
    const all = defaultModules();
    // whose program progress counts: the chosen clients, or the session's clients when sending to extra addresses only
    const ids = (rec&&rec.length ? rec.map(r=>r.id) : (s?.studentIds||[]));
    const doneMods = new Set(db.sessions.filter(x=>x.status==='done' && x.studentIds.some(id=>ids.includes(id))).map(x=>x.moduleId));
    if(s?.moduleId) doneMods.add(s.moduleId);
    const nm = (nextSess && all.find(x=>x.id===nextSess.moduleId))
      || (m.num ? all.find(x=>x.num===m.num+1) : null)
      || (!nextSess && !m.num ? all.find(x=>!doneMods.has(x.id)) : null);  // free topic: first program topic not done yet
    if(!nextSess && !nm){
      // finished the whole program
      return `<div style="background:${C.okSoft};border:1px solid #BFE8D2;border-radius:14px;padding:14px 18px;margin-top:16px;text-align:right">
        <div style="font-size:17px;font-weight:700;color:${C.ink}">🎉 סיימת את כל התוכנית!</div>
        <div style="font-size:14px;line-height:1.6;color:${C.ink2};margin-top:4px">עברנו יחד את כל ${all.length} הסשנים. מכאן ממשיכים לבנות לבד, ואני כאן לכל שאלה או לליווי נוסף.</div></div>`;
    }
    const when = nextSess ? `${fdateLong(nextSess.date)}${nextSess.time?' בשעה '+esc(nextSess.time):''}` : 'נתאם מועד בקרוב';
    const title = nextSess ? sessTitle(nextSess) : nm.title;
    const items = nm ? (nm.steps||[]).slice(0,4).map(x=>x.t) : [];
    return `<div style="background:#FFF8DE;border:1px solid #F2D46B;border-radius:14px;padding:14px 18px;margin-top:16px;text-align:right">
      <div style="font-size:13px;font-weight:700;color:#9A7410">📅 הסשן הבא · ${when}</div>
      <div style="font-size:17px;font-weight:700;color:${C.ink};margin-top:4px">${nm?`סשן ${nm.num}: `:''}${esc(title)}</div>
      ${nm?.goal?`<div style="font-size:14px;line-height:1.6;color:${C.ink2};margin-top:2px">${esc(nm.goal)}</div>`:''}
      ${items.length?`<div style="font-size:14px;color:${C.ink};margin-top:8px;font-weight:700">מה נעשה:</div>${items.map(t=>`<div style="font-size:14px;line-height:1.6;color:${C.ink2};padding:1px 0"><span style="color:${C.orange};font-weight:700">←</span>&nbsp; ${esc(t)}</div>`).join('')}`:''}
    </div>`; },
  button(href,label){ return `<table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:22px"><tr><td style="background:${C.orange};border-radius:12px"><a href="${esc(href)}" style="display:inline-block;padding:12px 22px;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px">${label}</a></td></tr></table>`; },
  sign(){ const S=db.settings; return `<div style="margin-top:26px;padding-top:16px;border-top:1px solid ${C.line};font-size:14.5px;color:${C.ink2};line-height:1.7">
     ${S.signature?`<div>${esc(S.signature)}</div>`:''}
     <div style="font-weight:700;color:${C.ink};margin-top:6px">${S.instructor?esc(S.instructor)+' | ':''}ספיד Automation</div>
     <div style="font-size:13px;color:${C.muted}">שאלות? אפשר פשוט לענות למייל הזה.</div></div>`; },
};
// full email document: loads Heebo where the mail app allows web fonts (Apple Mail, iPhone); Gmail and Outlook fall back to the reader's modern system font (Segoe UI, San Francisco, Roboto)
function emailDoc(inner){ return `<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet"><style>body,table,td,div,a,span{font-family:Heebo,'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Hebrew',Roboto,'Noto Sans Hebrew','Helvetica Neue',Arial,sans-serif}</style></head><body style="margin:0;padding:0;background:#FBF9F7">${inner}</body></html>`; }
function greet(rec){
  const n = rec.map(r=>esc(firstName(r.name))).filter(Boolean);
  if(!n.length) return 'היי,';
  if(n.length>4) return 'היי לכולם,';
  return 'היי ' + (n.length===1 ? n[0] : n.slice(0,-1).join(', ') + ' ו' + n[n.length-1]) + ',';
}
function buildMail(recOverride){
  let rec = recOverride || mailRecipients();
  const s = sessionById(mail.sessionId);
  if(!s) return {subject:'',html:'<div class="empty">בחרי סשן כדי לראות תצוגה מקדימה</div>'};
  // sending only to extra addresses (e.g. a test to yourself): greet the session's client by name
  if(!rec.length) rec = s.studentIds.map(student).filter(Boolean);
  // topics saved in the browser may predate the richer fields, so fill them from the built-in list
  const m = {...(defaultModules().find(x=>x.id===s.moduleId)||{}), ...(moduleById(s.moduleId)||{})};
  const steps = s.highlights?.length ? s.highlights.map(t=>({t})) : (m.steps?.length ? m.steps : (m.points||[]).map(t=>({t})));
  const next = s.homework ? [s.homework] : (m.next?.length ? m.next : (m.homework?[m.homework]:[]));
  const subject = `סיכום הסשן שלנו: ${sessTitle(s)} · ${fdate(s.date)} ✨`;
  const nextSess = db.sessions.filter(x=>x.status==='planned' && x.date>=s.date && x.studentIds.some(id=>rec.some(r=>r.id===id))).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const headline = m.headline
    ? esc(m.headline).replace('Claude Code',`<span style="color:${C.orange}">Claude Code</span>`)
    : `סיכום הסשן: <span style="color:${C.orange}">${esc(sessTitle(s))}</span>`;
  const html = `<div style="font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-0.4px;color:${C.ink};margin:24px 0 8px">${headline}</div>
    <div style="font-size:16px;line-height:1.7;color:${C.ink2};margin-bottom:18px">${greet(rec)}<br>${esc(m.lead||'תודה על הסשן! ריכזתי כאן את כל מה שעשינו, כדי שיהיה קל לחזור לזה ולהמשיך.')}</div>
    ${E.meta([['תאריך',fdate(s.date)],['משך הסשן',hrs(s.duration)],['נושא',esc(m.short||sessTitle(s))]])}
    ${E.payRow(s, rec)}
    ${mail.note?E.note(mail.note):''}
    ${steps.length?E.h2('מה עשינו בסשן')+E.steps(steps):''}
    ${E.lists(m.have||[], next)}
    ${m.prompt?E.h2('להמשך העבודה: מבנה של פרומפט טוב')+E.prompt(m.prompt):''}
    ${m.tip?E.tip(m.tip):(m.tips?.length?E.tip(m.tips[0]):'')}
    ${E.nextBox(nextSess, m, s, rec)}
    ${summaryFiles(s)?E.button(summaryFiles(s).page,'לצפייה בסיכום באתר ←')+`<div style="font-size:13px;color:${C.muted};margin-top:8px">📎 הסיכום מצורף גם כקובץ PDF</div>`:''}
    ${E.sign()}`;
  return {subject, html:E.wrap(html)};
}
const EMAIL_RE = /^[^\s@<>,]+@[^\s@<>,]+\.[^\s@<>,]+$/;
function mailExtras(){ return [...new Set(String(mail.extra||'').split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))]; }
function mailCheck(){
  const rec = mailRecipients();
  const extras = mailExtras(), bad = extras.filter(x=>!EMAIL_RE.test(x));
  if(bad.length){ toast('כתובת מייל לא תקינה: '+bad.join(', ')); return null; }
  if(!rec.length && !extras.length){ toast('צריך לבחור לקוח או לכתוב כתובת מייל'); return null; }
  const r = buildMail(); r.subject = mail.subject || r.subject; r.rec = rec; r.extras = extras;
  const noMail = rec.filter(s=>!s.email); if(noMail.length) toast(`שימי לב: אין מייל ל${noMail.map(s=>firstName(s.name)).join(', ')}`);
  return r;
}
async function api(body){
  const r = await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json().catch(()=>({error:r.status===404?'השליחה עובדת רק באתר שעלה ל-Vercel':'שגיאה '+r.status}));
  if(!r.ok) throw new Error(d.error||('שגיאה '+r.status));
  return d;
}
function htmlText(html){ const d=document.createElement('div'); d.innerHTML=html; d.style.cssText='position:fixed;left:-9999px'; document.body.appendChild(d); const t=d.innerText.replace(/\n{3,}/g,'\n\n'); d.remove(); return t; }
async function sendResend(){
  const r = mailCheck(); if(!r) return;
  const withMail = r.rec.filter(s=>s.email);
  const extras = r.extras.filter(x=>!withMail.some(s=>s.email.toLowerCase()===x.toLowerCase()));
  const n = withMail.length + extras.length;
  if(!n) return toast('לנמענים שנבחרו אין כתובת מייל');
  if(!confirm(`לשלוח ${n===1?'מייל אחד':n+' מיילים'} עכשיו?\n\n${[...withMail.map(s=>s.name+' <'+s.email+'>'), ...extras].join('\n')}`)) return;
  const pack = (to, b) => ({to:[to],subject:mail.subjectEdited? mail.subject : b.subject,html:emailDoc(b.html),text:htmlText(b.html),replyTo:db.settings.email, ...(files?{attachments:[{filename:files.name,path:files.pdf}]}:{})});
  const files = summaryFiles(sessionById(mail.sessionId));
  const general = buildMail([]);
  const emails = [...withMail.map(s=>pack(s.email, buildMail([s]))), ...extras.map(x=>pack(x, general))];
  const btn=$('#resendBtn'); if(btn){ btn.disabled=true; btn.textContent='בשליחה...'; }
  try{ await api({emails}); logMail({...r,rec:withMail,extras}); mail.extra=''; toast(`נשלח ✓ ${n===1?'מייל אחד':n+' מיילים'} יצאו לדרך 💌`); }
  catch(e){ toast('השליחה נכשלה: '+e.message); if(btn){ btn.disabled=false; btn.textContent='💌 שליחת הסיכום'; } }
}
function markSent(){ const r=mailCheck(); if(!r) return; logMail(r); toast('סומן כנשלח ✓'); }
function logMail(r){
  db.mails.push({id:uid(),date:new Date().toISOString(),type:'summary',sessionId:mail.sessionId||'',studentIds:r.rec.map(s=>s.id),extra:r.extras||[],subject:r.subject});
  save(); setTimeout(rerender,300);
}
function unlogMail(id){ db.mails=db.mails.filter(m=>m.id!==id); save(); rerender(); toast('הסימון בוטל'); }

  editStudent:id=>studentForm(student(id)),

  mailSession:(id,el)=>openMail({type:'summary',sessionId:id,...(el.dataset.sid?{studentIds:[el.dataset.sid]}:{})}),
  exportData:()=>{ const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`claude-studio-backup-${todayISO()}.json`; a.click(); },

};
document.addEventListener('click', e=>{ const a=e.target.closest('[data-act]'); if(!a) return; e.preventDefault(); ACTIONS[a.dataset.act]?.(a.dataset.id, a, e); });
function importData(file){ if(!file) return; const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.students||!d.sessions) throw 0; if(!confirm('לשחזר מהגיבוי? הנתונים הנוכחיים יוחלפו.')) return; db={...defaults(),...d}; save(); rerender(); toast('השחזור הצליח ✓'); }catch(e){ toast('הקובץ לא תקין'); } }; fr.readAsText(file); }
